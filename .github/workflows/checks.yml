name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift typecheck and component tests
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Check shell syntax
        run: |
          for script in MicTest/build.sh MicTest/build-dev.sh MicTest/tools/check.sh; do
            bash -n "$script"
          done

      - name: Typecheck and run component tests
        run: bash MicTest/tools/check.sh
